<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#060a4d;--card:#10179f;--tx:#fff;--mut:#b8c4ff;--ac:#2f80ff;--bd:#4a86f0;--ok:#5dffb0;--bad:#ff8a9a;--warn:#ffd24a;color-scheme:dark}

<body><div class="app"><nav id="nav" hidden><b>TIPO LOJA</b><button data-v="geral">▦ Resumo loja</button><button data-v="diaria">◷ Vendas diárias</button><button data-v="colab">☺ Lojistas</button></nav><div class="w">
<div class="top"><div><h1>Análise de Vendas da Loja</h1><div class="mut" id="sub">A carregar…</div></div>
<div><input type="file" id="fx" accept=".xlsx" hidden><button class="btn g2" id="up">Atualizar com Excel</button> <button class="btn g2" id="out" hidden>Sair</button></div></div>
<div id="lg" class="card" style="max-width:360px;margin:40px auto" hidden><h1>Entrar</h1><input id="em" type="email" placeholder="Email" autocomplete="username" style="width:100%;margin:10px 0 4px;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);box-sizing:border-box"><input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password" style="width:100%;margin:4px 0 10px;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);box-sizing:border-box"><button class="btn" id="li">Entrar</button><div class="mut" id="le" style="margin-top:8px"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const KP=[["TV",3],["Meo Energia",3],["PPP",1],["Refid's",1],["Facturação",1]];
const LB={"Refid's":"Refid’s","Facturação":"Faturação"};
const lab=k=>LB[k]||k;
const TPL={"TV":"Treinar a abordagem de TV e pacotes: perguntas de qualificação (quantos ecrãs, o que veem) e proposta no momento do contrato.",
"PPP":"Propor PPP em todos os atendimentos (MxO e stand-alone) e fazer role-play da objeção de preço.",
"Meo Energia":"Incluir a energia no fecho de cada contrato e praticar um argumento de poupança de 30 segundos.",
"Refid's":"Começar o turno com a lista de clientes a terminar fidelização e agendar os contactos de refidelização.",
"Facturação":"Trabalhar a venda associada (acessórios e smartphones) em cada equipamento vendido.",
"NPS":"Pedir feedback no fecho de cada atendimento e rever em conjunto os casos de NPS baixo.",
"Div":"Aumentar a variedade de produtos por cliente (acessórios, seguros, serviços) em cada venda.",
"Seg":"Propor seguro em todos os equipamentos e treinar o argumento de proteção."};
const VS={"Liliana Cardoso":"Liliana","Rodolfo Correia":"Rodolfo","Adriana Marta":"Adriana","Adriano Machado":"Adriano","Ana Rosado":"Ana Dulcineia","Ana Santos":"Ana Margarida","Julio Benck":"Julio","Carla Costa":"Carla","Cristiana Santos":"Cristiana","Pedro Carvalho":"Pedro","Telma Maltez":"Telma","Tiago Vigario":"Tiago"};
let db=null,snap=null,notes=[],sel="",msg="",wk=null,TR="",dd=null,ck="TV",view="geral",dv="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc=x=>x==null?"–":Math.round(x*100)+"%";
const nf=(n,k)=>n==null?"–":(k==="Facturação"?Math.round(n).toLocaleString("pt-PT")+" €":Math.round(n*10)/10);
const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};
const fr0=()=>(snap.dia||snap.dias||30)/(snap.dias||30);const pfo=d=>d.real/d.obj/fr0();
function ana(v,all){
  const r=[];
  for(const[k,w]of KP){const d=v.k[k];if(!d||!d.obj)continue;
    const cur=d.real/d.obj,pf=pfo(d),m=med(all.map(o=>o.k[k]&&o.k[k].obj?pfo(o.k[k]):null));
    let s="ok";if(pf<0.85)s="crit";else if(pf<1)s="fraco";else if(pf>=1.25&&pf>=m)s="forte";
    r.push({k,w,d,cur,pf,m,s,txt:`${nf(d.real,k)} / ${nf(d.obj,k)}`,gap:w*(1-Math.min(pf,1))});}
  const n=v.k.NPS;if(n&&n.obj!=null&&n.real!=null)r.push({k:"NPS",w:1,d:n,cur:n.real/n.obj,pf:null,s:n.real<n.obj?(n.real<n.obj*0.7?"crit":"fraco"):"forte",txt:`${Math.round(n.real*100)}% / ${Math.round(n.obj*100)}%`,gap:n.real<n.obj?1-n.real/n.obj:0});
  if(v.funcao!=="GOE"&&v.div!=null){const sd=snap.store.Diversos;
    if(!(sd&&sd.pf>=1.6)&&v.div<1.6)r.push({k:"Div",w:1,s:"fraco",txt:`${v.div.toFixed(2)} / 1,60`,gap:(1.6-v.div)/1.6});
    const ss=snap.store.Seguros;if(!(ss&&ss.pf>=0.15)&&v.seg<0.15)r.push({k:"Seg",w:1,s:"fraco",txt:`${(v.seg*100).toFixed(1)}% / 15%`,gap:(0.15-v.seg)/0.15});}
  return r;}
const SL={forte:"Ponto forte",ok:"Em linha",fraco:"A melhorar",crit:"Crítico"};
const KL={Div:"Diversidade",Seg:"Seguros",NPS:"NPS"};
const nm=k=>KL[k]||lab(k);
function peer(k,self){let b=null,bp=-1;for(const o of snap.vendedores){if(o.nome===self||!o.k[k]||!o.k[k].obj)continue;const p=pfo(o.k[k]);if(p>bp){bp=p;b=o.nome}}return b?`${b} (${pc(bp)})`:null}
function perito(){
 const V=snap.vendedores,rows=[],ins=[],SK={"Facturação":"Faturação","Refid's":"Refidelizações"};
 for(const[k]of KP){
  const a=V.map(v=>({n:v.nome,r:Math.max(0,(v.k[k]||{}).real||0)})).sort((x,y)=>y.r-x.r),t=a.reduce((s,x)=>s+x.r,0);if(!t)continue;
  const s1=a[0].r/t,s2=(a[0].r+a[1].r)/t;let c=0,n8=0;for(const x of a){c+=x.r;n8++;if(c>=.8*t)break}
  const m=med(a.map(x=>x.r)),op=a.filter(x=>x.r<m).reduce((s,x)=>s+m-x.r,0),ob=(snap.store[SK[k]||k]||{}).obj;
  const rk=s1>=.3||s2>=.5?"Alta":s1>=.2||s2>=.4?"Média":"Baixa",cl=rk==="Alta"?"crit":rk==="Média"?"fraco":"forte",z=a[a.length-1];
  rows.push(`<tr><td>${lab(k)}</td><td>${nf(t,k)}</td><td>${esc(a[0].n)} (${pc(s1)})</td><td>${pc(s2)}</td><td>${n8} de ${a.length}</td><td class="${cl}">${rk}</td><td>${nf(op,k)}</td><td>${esc(z.n)}</td></tr>`);
  if(rk!=="Baixa")ins.push(`<b>${lab(k)}:</b> ${n8} de ${a.length} colaboradores fazem 80% do resultado e ${esc(a[0].n)} pesa ${pc(s1)}. Se esta pessoa falhar, a loja perde essa fatia. Ação: ${esc(a[0].n)} acompanha ${esc(z.n)} e partilha a abordagem que usa.`);
  if(ob&&t<ob&&op>0)ins.push(`<b>${lab(k)}:</b> faltam ${nf(ob-t,k)} para o objetivo e, se quem está abaixo da mediana chegasse à mediana, a loja ganhava ${nf(op,k)}. Há margem na base da equipa.`);
 }
 return '<h2>Análise de especialista</h2><div class="card sc"><table><tr><th>Produto</th><th>Total</th><th>Líder (peso)</th><th>Top 2</th><th>Fazem 80%</th><th>Dependência</th><th>Potencial*</th><th>Mais fraco</th></tr>'+rows.join("")+'</table></div><div class="mut">*Unidades extra se quem está abaixo da mediana da equipa chegasse à mediana.</div><div class="card" style="margin-top:10px">'+(ins.slice(0,6).map(x=>`<p style="margin:6px 0">${x}</p>`).join("")||"Resultados bem distribuídos pela equipa.")+"</div>";}
const CK={"TV":"#3b82f6","PPP":"#a855f7","Meo Energia":"#f5b301","Refid's":"#14b8a6","Facturação":"#4ade80"};
function kcard(k,r,o,p,fl,fv){const c=CK[k];return `<div class="card" style="border-top:3px solid ${c}"><div style="color:${c};font-weight:700;font-size:12px">${lab(k).toUpperCase()}${k==="TV"||k==="Meo Energia"?" · CORE":""}</div><div class="big">${nf(r,k)}</div><div>Objetivo: ${nf(o,k)}${p!=null?" · "+pc(p):""}</div><div class="bar"><i style="width:${Math.min(100,(p||0)*100)}%;background:${c}"></i></div><div class="rw" style="border:0;padding:6px 0 0"><span class="mut">${fl}</span><b>${fv}</b></div></div>`}
function km(k,o,r,p,pf,fd,t,f){const c=CK[k]||"#8fb8ff",F=f||(n=>nf(n,k));return `<div class="card" style="border-top:3px solid ${c}"><div style="color:${c};font-weight:700">${t||lab(k).toUpperCase()}${k==="TV"||k==="Meo Energia"?" · CORE":""}</div><div class="rw" style="border:0"><span class="mut">Objetivo</span><span class="mut">Realizado</span></div><div class="rw" style="border:0;padding:0;font-size:20px;font-weight:700"><span>${F(o)}</span><span>${F(r)}</span></div><div class="rw" style="border-top:1px solid var(--bd);margin-top:8px"><b style="color:${c}">${pc(p)}</b><b style="color:${pf==null?"inherit":pf>=1?"var(--ok)":"var(--bad)"}">${pc(pf)}</b></div><div class="rw" style="border:0;padding:0"><span class="mut">Realizado</span><span class="mut">Previsão</span></div><div class="rw" style="border-top:1px solid var(--bd);margin-top:8px;border-bottom:0"><span class="mut">Falta/dia</span><b>${fd}</b></div></div>`}
function resumo(){
 const dias=snap.dias||30,V=dv?snap.vendedores.filter(x=>x.nome===dv):snap.vendedores;let d=Math.min(Math.max(1,dd||snap.dia||dias),dias);
 const SK={"Facturação":"Faturação","Refid's":"Refidelizações"},C={"TV":"#3b82f6","PPP":"#a855f7","Meo Energia":"#f5b301","Refid's":"#14b8a6","Facturação":"#4ade80"},S={},O={},T={};
 for(const[k]of KP){S[k]=Array(dias).fill(0);for(const v of V)if(v.d&&v.d[k])v.d[k].forEach((x,i)=>{if(i<dias)S[k][i]+=x});T[k]=dv&&V[0]?(V[0].k[k]||{}).obj||0:(snap.store[SK[k]||k]||{}).obj||0;O[k]=T[k]/dias}
 const pr=(k,i)=>O[k]&&i>=0?S[k][i]/O[k]:null,sm=(k,n)=>S[k].slice(0,n).reduce((a,b)=>a+b,0),pv=k=>T[k]?sm(k,d)/T[k]/(d/dias):0;
 let ts=0,tw=0;for(const[k,w]of KP){const p=pr(k,d-1);if(p!=null){ts+=w*Math.min(p,1.5);tw+=w}}
 const cz=tw?ts/tw:0,st=cz>=1?["No rumo certo","#22c55e"]:cz>=.7?["Atenção","#f5b301"]:["Em risco","#ef4444"];
 const ring=(p,c)=>`<svg viewBox="0 0 120 120" width="110" height="110"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${Math.min(1,p)*314} 314" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" fill="var(--tx)" font-size="20" font-weight="700">${pc(p)}</text></svg>`;
 let h=`<div class="card top"><div><div class="mut">LOJA · ACOMPANHAMENTO DO DIA</div><h1>Vendas Diárias</h1><div class="mut">Realizado, objetivo e contribuição da equipa</div></div><div><div class="mut">DATA DO RESUMO</div><select onchange="dd=+this.value;render()" style="width:auto">${Array.from({length:dias},(_,i)=>`<option value="${i+1}" ${i+1===d?"selected":""}>Dia ${i+1} · ${esc(snap.mes)}</option>`).join("")}</select></div><div><div class="mut">CONCRETIZAÇÃO DO DIA</div><div class="big" style="color:${st[1]}">${pc(cz)}</div><b style="color:${st[1]}">● ${st[0]}</b></div></div>`;
 h+='<div class="g" style="margin-top:12px">'+KP.map(([k])=>kcard(k,S[k][d-1],O[k],pr(k,d-1),"Falta hoje",nf(Math.max(0,O[k]-S[k][d-1]),k))).join("")+"</div>";
 const rows=snap.vendedores.map(v=>({n:v.nome,x:KP.map(([k])=>v.d&&v.d[k]?v.d[k][d-1]:0)})).filter(r=>dv?r.n===dv:(r.x[0]>0||r.x[1]>0)).sort((p,q)=>(q.x[0]+q.x[1])-(p.x[0]+p.x[1]));
 h+=`<div class="card" style="margin-top:12px"><div class="top"><b class="mut">COLABORADOR</b><select onchange="dv=this.value;render()" style="width:auto"><option value="">Todos os colaboradores</option>${snap.vendedores.map(v=>`<option ${v.nome===dv?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></div><div class="sc"><table><tr><th>Colaborador</th>${KP.map(([k])=>`<th>${lab(k)}</th>`).join("")}</tr>${rows.map(r=>`<tr><td><b>${esc(r.n)}</b></td>${r.x.map((x,i)=>`<td>${nf(x,KP[i][0])}</td>`).join("")}</tr>`).join("")||'<tr><td colspan="6" class="mut">Sem vendas de TV ou Energia neste dia.</td></tr>'}</table></div><div class="mut">Só aparecem colaboradores com vendas de TV ou Energia nesse dia.</div></div>`;
 const f=S["Facturação"][d-1],pf=pr("Facturação",d-1);
 h+=`<div class="g3"><div class="card"><div class="mut">PREVISÃO TV</div>${ring(pv("TV"),C.TV)}<div class="mut">${nf(sm("TV",d),"TV")} / ${nf(T.TV,"TV")} no mês</div></div><div class="card" style="text-align:center;border-color:#1f6b45"><div class="mut">FATURAÇÃO DO DIA</div><div class="big" style="font-size:34px">${nf(f,"Facturação")}</div><div class="mut">Objetivo do dia: ${nf(O["Facturação"],"Facturação")}</div><div style="color:${pf>=1?"#22c55e":"#ef4444"};font-weight:700;margin-top:6px">${pc(pf)} ${pf>=1?"acima do objetivo":"abaixo do objetivo"}</div></div><div class="card"><div class="mut">PREVISÃO MEO ENERGIA</div>${ring(pv("Meo Energia"),C["Meo Energia"])}<div class="mut">${nf(sm("Meo Energia",d),"Meo Energia")} / ${nf(T["Meo Energia"],"Meo Energia")} no mês</div></div></div>`;
 const cum=[];let a=0;S[ck].slice(0,d).forEach(x=>{a+=x;cum.push(a)});
 const mx=Math.max(T[ck],a,1),X=i=>10+i*300/Math.max(1,dias-1),Y=v=>125-v/mx*110;
 h+=`<div class="g3"><div class="card"><div class="mut">EVOLUÇÃO DO MÊS (acumulado)</div><div class="chips" style="padding:6px 0">${KP.map(([k])=>`<button class="chip ${k===ck?"on":""}" data-k="${k}" onclick="ck=this.dataset.k;render()">${lab(k)}</button>`).join("")}</div><svg viewBox="0 0 320 140" style="width:100%"><polyline points="${X(0)},${Y(T[ck]/dias)} ${X(dias-1)},${Y(T[ck])}" fill="none" stroke="var(--mut)" stroke-dasharray="4 3"/><polyline points="${cum.map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke="${C[ck]}" stroke-width="2.5"/></svg><div class="mut">Linha cheia: real · tracejado: objetivo (${nf(T[ck],ck)} no mês)</div></div>`;
 h+='<div class="card"><div class="mut">COMPARATIVO COM ONTEM</div>'+KP.map(([k])=>{const t=S[k][d-1],y=d>1?S[k][d-2]:null,df=y==null?null:t-y;return `<div class="rw"><span>${lab(k)}</span><span>${nf(t,k)}</span><span class="mut">Ontem ${y==null?"–":nf(y,k)}</span><b class="${df==null?"":df>=0?"forte":"crit"}">${df==null?"–":(df>=0?"▲ +":"▼ ")+nf(df,k)}</b></div>`}).join("")+"</div>";
 h+='<div class="card"><div class="mut">DESEMPENHO DO MÊS ATÉ AO DIA '+d+'</div>'+KP.map(([k])=>{const p=T[k]?sm(k,d)/T[k]:0;return `<div style="margin-top:8px"><div class="rw" style="border:0;padding:0"><span>${lab(k)}</span><b style="color:${C[k]}">${pc(p)}</b></div><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${C[k]}"></i></div></div>`}).join("")+"</div></div>";
 return h;}
function loja(){
  const S=snap.store,dia=snap.dia||snap.dias,rest=Math.max(1,snap.dias-dia),tco=S.TCO;
