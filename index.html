.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

ol{padding-left:20px;margin:6px 0}.app{display:flex;min-height:100vh}nav{display:flex;flex-direction:column;gap:6px;padding:14px 10px;width:190px;flex:none;background:var(--navbg);border-right:1px solid var(--bd)}nav[hidden]{display:none}nav b{font-size:16px;padding:6px 10px 14px}nav button{text-align:left;background:none;border:0;color:var(--navtx);padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap}nav button.on{background:var(--navon);color:var(--navonx)}nav button i{font-style:normal}nav .nt{margin-left:6px}.app>.w{flex:1;min-width:0;max-width:1100px;margin:0}@media(max-width:760px){.app{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}nav b{display:none}nav button{white-space:nowrap}}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:10px}.rw{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}li{margin:6px 0}
.w{padding:10px}h1{font-size:1.25em}h2{margin:10px 0 6px}.big{font-size:1.5em}.card{padding:8px 10px}th,td{padding:3px 6px}body{font-size:clamp(11px,1.65vh,15px)}

details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary::before{content:'▸ ';color:var(--mut)}details[open]>summary::before{content:'▾ '}details[open]>summary{margin-bottom:8px}

.hg td.dh{outline:2px solid var(--wec);outline-offset:-2px}.hg td.colhl{background:var(--rowhl)!important}.hg td.coldim{opacity:.3}.hg tr.dim td{opacity:.3}.hg tr.rowhl td{background:var(--rowhl)}

.btn.g2{padding:5px 10px;font-size:.85em}#ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.tdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}.tdot.on{outline:2px solid var(--tx);outline-offset:1px}

/* ===== Liquid Glass v2 ===== */
:root[data-tema="vidro"][data-fundo="porsol"]{--bodybg:radial-gradient(circle at 24% 34%,rgba(255,236,170,.95) 0,rgba(255,170,90,.85) 11%,transparent 11.6%),radial-gradient(circle at 78% 62%,rgba(255,200,120,.9) 0,rgba(255,160,60,.7) 8%,transparent 8.6%),linear-gradient(115deg,transparent 0 46%,rgba(255,255,255,.22) 46% 48%,transparent 48% 100%),radial-gradient(ellipse at 85% 105%,#ffb347 0,transparent 55%),radial-gradient(ellipse at 15% 95%,#ffb347 0,transparent 50%),radial-gradient(ellipse at 50% 0%,#ffd9a0 0,transparent 55%),linear-gradient(180deg,#5aa9ff 0%,#8fb3ff 45%,#ff9a6b 100%) fixed}
:root[data-tema="vidro"][data-fundo="oceano"]{--bodybg:radial-gradient(circle at 30% 40%,rgba(200,255,245,.95) 0,rgba(60,230,210,.8) 10%,transparent 10.6%),radial-gradient(circle at 75% 65%,rgba(120,200,255,.9) 0,rgba(40,120,255,.7) 9%,transparent 9.6%),linear-gradient(115deg,transparent 0 50%,rgba(255,255,255,.2) 50% 52%,transparent 52% 100%),radial-gradient(ellipse at 90% 10%,#3fe0c5 0,transparent 45%),radial-gradient(ellipse at 10% 90%,#2b7bff 0,transparent 55%),radial-gradient(ellipse at 60% 100%,#6be0ff 0,transparent 50%),linear-gradient(160deg,#0f7bff 0%,#0bb8b0 55%,#1f4fe0 100%) fixed}
:root[data-tema="vidro"][data-fundo="aurora"]{--bodybg:radial-gradient(circle at 26% 36%,rgba(170,255,210,.95) 0,rgba(60,255,170,.75) 10%,transparent 10.6%),radial-gradient(circle at 80% 60%,rgba(220,170,255,.9) 0,rgba(150,90,255,.7) 9%,transparent 9.6%),linear-gradient(115deg,transparent 0 48%,rgba(255,255,255,.18) 48% 50%,transparent 50% 100%),radial-gradient(ellipse at 20% 20%,#4cffb0 0,transparent 45%),radial-gradient(ellipse at 85% 30%,#b06bff 0,transparent 50%),radial-gradient(ellipse at 50% 100%,#3aa0ff 0,transparent 55%),linear-gradient(160deg,#1b2a6b 0%,#3b2a8f 50%,#0f5d7a 100%) fixed}

:root[data-tema="vidro"][data-fundo="prata"] nav button{text-shadow:none}
/* fundo Prata (estilo vidro da Apple) */
:root[data-tema="vidro"][data-fundo="prata"]{--bodybg:radial-gradient(circle at 25% 40%,rgba(255,255,255,.95) 0,rgba(225,230,240,.7) 11%,transparent 11.6%),radial-gradient(circle at 80% 66%,rgba(255,255,255,.8) 0,rgba(190,198,212,.6) 8%,transparent 8.6%),linear-gradient(rgba(70,80,100,.12) 1px,transparent 1px) -1px -1px/128px 128px,linear-gradient(90deg,rgba(70,80,100,.12) 1px,transparent 1px) -1px -1px/128px 128px,radial-gradient(ellipse at 18% 12%,#ffffff 0,transparent 55%),linear-gradient(135deg,#eceef2 0%,#cfd3da 42%,#9aa1ae 100%) fixed;--tx:#0f1521;--mut:#46506a;--ac:#1b63e8;--ok:#0b8f5a;--bad:#c8321f;--warn:#a85f00;--bd:rgba(255,255,255,.75);--th:rgba(255,255,255,.35);--thc:#2b3550;--we:rgba(255,170,80,.22);--wec:#7a4a00;--rowhl:rgba(40,110,240,.18);--navtx:#1a2236;--blur:blur(26px) saturate(180%) brightness(1.08);--shadow:0 18px 40px rgba(40,50,75,.22),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.45),inset 1px 0 0 rgba(255,255,255,.5),inset -1px 0 0 rgba(255,255,255,.35);--cardbg:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.30) 45%,rgba(255,255,255,.18) 70%,rgba(255,255,255,.42) 100%);--navbg:rgba(255,255,255,.4);color-scheme:light}
:root[data-tema="vidro"][data-fundo="prata"] body::before{display:none}
:root[data-tema="vidro"][data-fundo="prata"] nav{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.22))}
:root[data-tema="vidro"][data-fundo="prata"] nav button{color:#1a2236}
:root[data-tema="vidro"][data-fundo="prata"] nav button.on{color:#fff}
:root[data-tema="vidro"][data-fundo="prata"] nav button i{background:rgba(255,255,255,.65);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(40,50,75,.2)}
:root[data-tema="vidro"][data-fundo="prata"] #main [style*="color:#"]:not(.big){filter:none}
:root[data-tema="vidro"][data-fundo="prata"] .chip{color:#1a2236}:root[data-tema="vidro"][data-fundo="prata"] .chip.on{color:#fff}
:root[data-tema="vidro"][data-fundo="prata"] .chips{background:rgba(255,255,255,.45);box-shadow:inset 0 1px 3px rgba(40,50,75,.18)}
:root[data-tema="vidro"][data-fundo="prata"] .btn,:root[data-tema="vidro"][data-fundo="prata"] #ctl button,:root[data-tema="vidro"][data-fundo="prata"] #ctl .btn{color:#1a2236;background:rgba(255,255,255,.5)}
:root[data-tema="vidro"][data-fundo="prata"] select,:root[data-tema="vidro"][data-fundo="prata"] input{background:rgba(255,255,255,.6);color:#0f1521}
:root[data-tema="vidro"][data-fundo="prata"] .big{text-shadow:none}
:root[data-tema="vidro"][data-fundo="prata"] th{color:#46506a}
:root[data-tema="vidro"][data-fundo="prata"] tr:hover td{background:rgba(255,255,255,.4)}
:root[data-tema="vidro"][data-fundo="prata"] .bar{background:rgba(40,50,75,.12)}
:root[data-tema="vidro"][data-fundo="prata"] svg rect[rx]{filter:drop-shadow(0 4px 8px rgba(40,70,140,.3))}

/* ===== efeito água ===== */
#waterbg,#ripl{display:none}
:root[data-tema="vidro"] #waterbg{display:none!important;position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;mix-blend-mode:soft-light}
:root[data-tema="vidro"] #waterbg{overflow:hidden}:root[data-tema="vidro"] #waterbg svg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;display:block;animation:waterdrift 18s ease-in-out infinite alternate}
@keyframes waterdrift{0%{transform:translate(-3%,-2%) scale(1)}100%{transform:translate(3%,2%) scale(1.06)}}
:root[data-tema="vidro"][data-fundo="prata"] #waterbg{opacity:.45;mix-blend-mode:overlay}
:root[data-tema="vidro"] .card,:root[data-tema="vidro"] nav{background-size:240% 240%}
@keyframes glassflow{0%{background-position:0% 0%}100%{background-position:100% 100%}}
:root[data-tema="vidro"] .rip{position:fixed;z-index:9999;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(255,255,255,.6),inset 0 0 12px rgba(255,255,255,.5);animation:ripple 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.rip{display:none}:root[data-tema="vidro"] .rip{display:block}
@keyframes ripple{from{transform:scale(1);opacity:.95}to{transform:scale(18);opacity:0;border-width:1px}}
html[data-agua="off"] #waterbg{display:none!important}html[data-agua="off"] .card,html[data-agua="off"] nav{animation:none!important}

:root[data-tema="vidro"][data-fundo="grafite"]{--bodybg:radial-gradient(circle at 24% 36%,rgba(235,238,244,.9) 0,rgba(150,158,170,.75) 10%,transparent 10.6%),radial-gradient(circle at 80% 64%,rgba(200,206,216,.85) 0,rgba(110,118,130,.7) 8%,transparent 8.6%),linear-gradient(115deg,transparent 0 47%,rgba(255,255,255,.16) 47% 49%,transparent 49% 100%),radial-gradient(ellipse at 20% 10%,#7a8392 0,transparent 55%),linear-gradient(160deg,#4a515d 0%,#2b3038 55%,#15181d 100%) fixed;--gt:.18}
/* ===== fundo Paisagem: vidro transparente sobre imagem ===== */
html{--gb:9px;--gt:.14}

 h+=`<div id="npscap"><div style="font-weight:700;margin:0 0 6px">Solicitações NPS · ${esc(npsM)} · dias ${npsA} a ${npsB} · meta ${NPS_T} diferentes por dia</div>`+'<div class="card sc"><table><tr><th>Lojista</th><th>Estado</th><th>Dias de trabalho</th><th>Dias cumpridos</th><th>Dias falhados</th><th>% cumprimento</th><th>Em falta</th><th style="white-space:nowrap">'+(NPSR[0]?NPSR[0].ds.map(x=>'<span style="display:inline-block;min-width:26px;text-align:center;font-size:.8em">'+x.d+'</span>').join(''):'Por dia')+'</th><th data-html2canvas-ignore></th></tr>'+NPSR.map((r,i)=>{const st=!r.dt?'<span class="mut">Isenta/o (sem dias de trabalho)</span>':r.nc?'<span class="crit">Não cumpriu</span>':'<span class="forte">Cumpriu</span>';
  return `<tr><td><b>${esc(r.n)}</b></td><td>${st}</td><td>${r.dt}</td><td>${r.ok}</td><td>${r.fa.length}</td><td title="${r.reg} de ${r.esp} solicitações"><b class="${r.pc==null?"mut":r.pc>=1?"forte":"crit"}">${r.pc==null?"–":Math.round(r.pc*100)+"%"}</b> <span class="mut" style="font-size:.8em">${r.dt?r.reg+"/"+r.esp:""}</span></td><td>${r.falta}</td><td style="white-space:nowrap">${r.ds.map(x=>x.w?`<span class="${x.ok?"forte":"crit"}" title="dia ${x.d}: ${x.c}/${NPS_T}" style="display:inline-block;min-width:26px;text-align:center;font-size:.8em">${x.c}</span>`:`<span class="mut" title="dia ${x.d}: ${x.ex?"exceção (não conta)":esc(x.cod||"-")}" style="display:inline-block;min-width:26px;text-align:center;font-size:.8em">${x.ex?"ex":"·"}</span>`).join("")}</td><td data-html2canvas-ignore>${r.nc?`<button class="chip" onclick="npsCopy(${i})">Copiar email</button>`:""}</td></tr>`}).join("")+'</table><div class="mut" style="margin-top:6px">Os números por baixo de cada dia são as solicitações diferentes registadas: verde = meta cumprida, vermelho = em falta, ponto = não trabalhou (folga, férias, etc.), «ex» = dia de exceção, não conta.'+npsExTxt(C.D)+'</div></div></div>';
 if(bad.length){h+=`<h3 style="margin:14px 0 6px">Emails para os ${bad.length} lojistas abaixo da meta</h3><div class="mut" style="margin-bottom:6px">Escolhe «Copiar texto» e cola no email. O assunto copia-se à parte.</div>`+NPSR.map((r,i)=>{if(!r.nc)return"";const t=npsTxt(r),k=t.indexOf("\n\n"),sub=t.slice(9,k),bod=t.slice(k+2);return `<details class="card" style="margin-bottom:8px"><summary><b>${esc(r.n)}</b> <span class="mut">· falhou ${r.fa.length} de ${r.dt} dias</span></summary><div class="mut" style="margin:8px 0 4px">Assunto: ${esc(sub)}</div><div style="white-space:pre-wrap;user-select:text;margin:6px 0">${esc(bod)}</div><button class="chip" onclick="npsCopy(${i},'t')">Copiar texto</button> <button class="chip" onclick="npsCopy(${i},'a')">Copiar assunto</button> <button class="chip" onclick="npsMail(${i})">Abrir no email</button></details>`}).join("")}
 if(C.dup.length)h+=`<div class="card" style="margin-top:8px;border-color:var(--warn)"><b class="fraco">Solicitações registadas mais do que uma vez</b><div class="mut">Contam uma só vez para cada lojista. Se aparece em dois lojistas, vale a pena perguntar quem a fez.</div>${C.dup.map(([s,v])=>`<div>${esc(s)} · ${v.map(esc).join(" e ")}</div>`).join("")}</div>`;
 if(C.semp.length)h+=`<div class="card" style="margin-top:8px;border-color:var(--warn)"><b class="fraco">Nomes da folha que não encontrei no horário:</b> ${C.semp.map(esc).join(", ")}</div>`;
 return h}

const loadAvs=async()=>{const{data}=await sb.from("snap").select("data").eq("id","avals").maybeSingle();AVS=data&&data.data?data.data:{}};
const loadHor=async()=>{const{data}=await sb.from("snap").select("data").eq("id","horario").maybeSingle();HOR=data?data.data:null;hStrip()};const saveHor=async()=>{HOR.at=Date.now();await chk(sb.from("snap").upsert({id:"horario",data:HOR}))};
const chk=async p=>{const{error}=await p;if(error)throw error};
const mk=()=>({
 doc:()=>({set:async d=>{await chk(sb.from("snap").upsert({id:"current",data:d}));await loadSnap()},onSnapshot:cb=>{L.snap.push(cb);loadSnap()}}),
 collection:()=>({add:async d=>{await chk(sb.from("notes").insert(d));await loadNotes()},
  doc:id=>({delete:async()=>{await chk(sb.from("notes").delete().eq("id",id));await loadNotes()}}),
  onSnapshot:cb=>{L.notes.push(cb);loadNotes()}})});
async function entrar(){db=mk();loadHist().then(()=>{useSnap();render()});loadHor().then(render);loadCfg().then(render);loadAco().then(render);loadAvs().then(render);loadNps().then(render);loadFrm().then(render);loadCo().then(render);loadBr().then(render);loadLive().then(()=>{useSnap();render()});if(new Date().getDay()===1)view="semanal";$("nav").hidden=false;$("lg").hidden=true;$("out").hidden=false;$("up").hidden=false;db.doc().onSnapshot(s=>{CUR=s.exists?s.data():null;useSnap();render()});db.collection().onSnapshot(q=>{notes=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);render()})}
function login(){db=null;$("nav").hidden=true;snap=null;CUR=null;mid=null;$("msel").hidden=true;$("lg").hidden=false;$("out").hidden=true;$("up").hidden=true;$("main").innerHTML="";$("chips").innerHTML="";$("sub").textContent="Acesso reservado"}
$("li").onclick=async()=>{$("le").textContent="";const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)$("le").textContent="Email ou palavra-passe incorretos.";else{$("pw").value="";entrar()}};
$("out").onclick=async()=>{await sb.auth.signOut();login()};
$("fb").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const j=JSON.parse(await fl.text());if(!j||j.v!==1||!Array.isArray(j.snap))throw new Error("ficheiro inválido");if(!confirm("Restaurar a cópia de "+String(j.em||"").slice(0,10)+"? Isto substitui os dados que tenham os mesmos nomes."))throw new Error("cancelado");
   if(j.snap.length)await chk(sb.from("snap").upsert(j.snap));if((j.notes||[]).length)await chk(sb.from("notes").upsert(j.notes));if((j.live||[]).length)await chk(sb.from("live").upsert(j.live));
   await loadSnap();await loadNotes();await loadHist();await loadHor();await loadLive();useSnap();msg="cópia restaurada"}catch(err){msg=err.message==="cancelado"?"":"Erro ao restaurar: "+(err.message||err)}e.target.value="";render()};
$("fh").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const wb=XLSX.read(await fl.arrayBuffer(),{type:"array",cellDates:true,cellFormula:false,cellStyles:false}),nw=parseHor(wb),k=Object.keys(nw);if(!k.length)throw new Error("não encontrei folhas com nomes de meses");
   HOR={meses:Object.assign({},HOR&&HOR.meses,nw),at:Date.now()};hStrip();const cm=MNL[new Date().getMonth()];hm=k.includes(cm)?cm:k[0];hsel=null;await saveHor();msg="horário carregado ("+k.length+" meses)"}catch(err){msg="Erro a ler o horário: "+(err.message||err)}
  e.target.value="";render()};
$("fn").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const wb=XLSX.read(await fl.arrayBuffer(),{type:"array",cellDates:true,cellFormula:false,cellStyles:false}),nw=npsParse(wb),k=Object.keys(nw);if(!k.length)throw new Error("não encontrei folhas de meses com as colunas Data, Lojista e Solicitação");
   k.forEach(m=>{if((NPS[m]||{}).ini)nw[m].ini=NPS[m].ini;if((NPS[m]||{}).ex)nw[m].ex=NPS[m].ex});NPS=Object.assign({},NPS,nw);await chk(sb.from("snap").upsert({id:"nps",data:NPS}));npsM=k[k.length-1];npsA=0;npsB=0;msg="folha NPS carregada ("+k.join(", ")+")"}catch(err){msg="Erro a ler a folha NPS: "+(err.message||err)}
  e.target.value="";render()};
setInterval(()=>{if(db&&(view==="diaria"||view==="reg")&&!(document.activeElement&&document.activeElement.tagName==="SELECT"))refreshLive()},20000);
buildNav();try{let tt=localStorage.getItem("tema")||"azul";if(tt==="lilas")tt="claro";if(tt==="grafite")tt="vidro";const nu=localStorage.getItem("nav");setTema(tt);if(nu&&localStorage.getItem("navuser"))setNav(nu)}catch(e){}
window.addEventListener("beforeprint",()=>document.querySelectorAll("details").forEach(d=>d.open=true));
(async()=>{const{data}=await sb.auth.getSession();if(data.session)entrar();else login()})();
</script></body></html>
